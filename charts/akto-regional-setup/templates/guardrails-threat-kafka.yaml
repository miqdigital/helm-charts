{{- if and .Values.guardrailsThreatBuffer.enabled .Values.guardrailsThreatBuffer.kafka.enabled }}
{{/*
The malicious-event buffer's own broker: guardrails-service produces to it,
guardrails-threat-forwarder drains it. Kept off the traffic brokers so its
retention can be sized for how long central may be unreachable.

Node-local disk only, same as mini-runtime's broker - no PVC, so the buffer
survives a forwarder or central outage but not this pod being replaced.
*/}}
{{- $buffer := .Values.guardrailsThreatBuffer }}
{{- $kafka := $buffer.kafka }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "guardrails-threat-kafka") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "guardrails-threat-kafka") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-threat-kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-threat-kafka") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "akto-regional-setup.serviceAccountName" . }}
      restartPolicy: Always
      containers:
      {{- include "akto-regional-setup.kafka.brokerContainer" (list . "guardrails-threat-kafka" (dict "image" $kafka.image "clusterId" $kafka.clusterId "createTopics" (printf "%s:%v:1" $buffer.kafkaTopic $kafka.topicPartitions) "logRetentionHours" $kafka.logRetentionHours "resources" $kafka.resources) $kafka.service.kafkaPort) | nindent 6 }}
      {{- include "akto-regional-setup.scheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "guardrails-threat-kafka") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "guardrails-threat-kafka") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-threat-kafka") | nindent 4 }}
  ports:
  - name: kafka
    port: {{ $kafka.service.kafkaPort }}
    targetPort: {{ $kafka.service.kafkaPort }}
    protocol: TCP
{{- end }}
