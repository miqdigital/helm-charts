{{/*
Env shared by both guardrails-service flavours. Defined here because it is
meaningless outside this file.
*/}}
{{- define "akto-regional-setup.guardrailsService.env" -}}
- name: AKTO_LOG_LEVEL
  value: {{ quote .Values.global.aktoLogLevel }}
- name: LOG_LEVEL
  value: {{ quote .Values.guardrailsService.env.logLevel }}
- name: KUBERNETES_CLUSTER_DOMAIN
  value: {{ quote .Values.global.kubernetesClusterDomain }}
# Auto-wired to agent-guard in this release.
- name: SCANNER_API_URL
  value: {{ include "akto-regional-setup.guardrails.scannerUrl" . | quote }}
- name: NHI_ENABLED
  value: {{ quote .Values.guardrailsService.env.nhiEnabled }}
- name: NHI_SCAN_INTERVAL_MIN
  value: {{ quote .Values.guardrailsService.env.nhiScanIntervalMin }}
- name: SCAN_TIMEOUT_SEC
  value: {{ quote .Values.guardrailsService.env.scanTimeoutSec }}
- name: GUARDRAILS_VALIDATION_TIMEOUT_MS
  value: {{ quote .Values.guardrailsService.env.guardrailsValidationTimeoutMs }}
{{- with .Values.guardrailsService.env.guardrailsSkipPaths }}
- name: GUARDRAILS_SKIP_PATHS
  value: {{ quote . }}
{{- end }}
{{- with .Values.guardrailsService.env.cacheMode }}
- name: CACHE_MODE
  value: {{ quote . }}
{{- end }}
{{- include "akto-regional-setup.guardrailsService.redisEnv" . | nindent 0 }}
{{- if .Values.guardrailsService.env.embedderUrl }}
- name: EMBEDDER_URL
  value: {{ quote .Values.guardrailsService.env.embedderUrl }}
{{- else if .Values.embedder.enabled }}
- name: EMBEDDER_URL
  value: {{ include "akto-regional-setup.embedder.url" . | quote }}
{{- end }}
{{- with .Values.guardrailsService.env.rsaPublicKey }}
- name: RSA_PUBLIC_KEY
  value: {{ quote . }}
{{- end }}
# Auto-wired to the central cloud.
- name: DATABASE_ABSTRACTOR_SERVICE_URL
  value: {{ include "akto-regional-setup.central.databaseAbstractorUrl" . | quote }}
- name: THREAT_BACKEND_URL
  value: {{ include "akto-regional-setup.central.threatBackendUrl" . | quote }}
- name: THREAT_DETECTION_API_URL
  value: {{ include "akto-regional-setup.central.threatDetectionApiUrl" . | quote }}
{{- include "akto-regional-setup.central.tokenEnv" . | nindent 0 }}
{{- end }}

{{- if .Values.guardrailsService.http.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "guardrails-service-http") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "guardrails-service-http") | nindent 4 }}
spec:
  replicas: {{ .Values.guardrailsService.http.replicas }}
  selector:
    matchLabels:
      {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-service-http") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-service-http") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "akto-regional-setup.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: guardrails-service
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.guardrailsService.image.repository }}:{{ .Values.guardrailsService.image.tag }}"
        imagePullPolicy: {{ .Values.guardrailsService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.guardrailsService.http.service.targetPort }}
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: {{ quote .Values.guardrailsService.http.service.targetPort }}
        {{- include "akto-regional-setup.guardrailsService.env" . | nindent 8 }}
        {{- include "akto-regional-setup.probes" (list .Values.guardrailsService.http .Values.guardrailsService.http.service.targetPort) | nindent 8 }}
        resources:
          {{- toYaml .Values.guardrailsService.http.resources | nindent 10 }}
        volumeMounts:
          {{- include "akto-regional-setup.keyVault.volumeMounts" . | nindent 8 }}
      volumes:
        {{- include "akto-regional-setup.keyVault.volumes" . | nindent 6 }}
      {{- include "akto-regional-setup.scheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "guardrails-service-http") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "guardrails-service-http") | nindent 4 }}
  {{- with .Values.guardrailsService.http.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.guardrailsService.http.service.type }}
  selector:
    {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-service-http") | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.guardrailsService.http.service.port }}
    targetPort: {{ .Values.guardrailsService.http.service.targetPort }}
    protocol: TCP
{{- end }}

{{- if .Values.guardrailsService.kafka.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "guardrails-service-kafka") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "guardrails-service-kafka") | nindent 4 }}
spec:
  replicas: {{ .Values.guardrailsService.kafka.replicas }}
  selector:
    matchLabels:
      {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-service-kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akto-regional-setup.componentSelectorLabels" (list . "guardrails-service-kafka") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "akto-regional-setup.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: guardrails-service
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.guardrailsService.image.repository }}:{{ .Values.guardrailsService.image.tag }}"
        imagePullPolicy: {{ .Values.guardrailsService.image.pullPolicy }}
        env:
        - name: RUN_MODE
          value: "kafka"
        # Auto-wired to guardrails-kafka, else the mini-runtime broker.
        - name: AKTO_KAFKA_BROKER_URL
          value: {{ include "akto-regional-setup.guardrails.kafkaBroker" . | quote }}
        {{- include "akto-regional-setup.guardrailsService.env" . | nindent 8 }}
        resources:
          {{- toYaml .Values.guardrailsService.kafka.resources | nindent 10 }}
        volumeMounts:
          {{- include "akto-regional-setup.keyVault.volumeMounts" . | nindent 8 }}
      volumes:
        {{- include "akto-regional-setup.keyVault.volumes" . | nindent 6 }}
      {{- include "akto-regional-setup.scheduling" . | nindent 6 }}
{{- end }}
