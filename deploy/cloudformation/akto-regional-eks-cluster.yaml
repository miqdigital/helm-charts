AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Minimal EKS cluster (VPC, public subnets, EKS control plane, managed node
  group) for test-driving the akto-regional-setup Helm chart with
  lambdaEgressProxy, dataIngestion, guardrailsService and miniRuntime enabled.
  Nodes sit in public subnets with direct Internet Gateway egress (no NAT
  Gateway) to keep this template simple and cheap - not a production layout.
  After the stack completes, deploy the akto-regional-setup chart with helm;
  this template only creates the underlying AWS infrastructure.

Parameters:
  ClusterName:
    Type: String
    Default: akto-regional-eks
    Description: Name of the EKS cluster.

  KubernetesVersion:
    Type: String
    Default: ""
    Description: >
      EKS control plane version, e.g. "1.31". Leave blank (default) to let
      EKS use its current default version - avoids this template going stale
      as AWS deprecates old versions from standard support. Only set this if
      you need a specific version.

  NodeInstanceType:
    Type: String
    Default: m5.2xlarge
    Description: >
      Worker node instance type. The five components' CPU requests total
      ~7.25 vCPU (data-ingestion 2, mini-runtime 2 incl. its Kafka sidecar,
      guardrails-service 2, agent-guard 1, lambda-egress-proxy 0.25), so
      2x m5.2xlarge (8 vCPU/32GiB each) leaves comfortable headroom.
      2x m5.xlarge does NOT fit - 3x m5.xlarge is the cheaper alternative.

  NodeGroupDesiredSize:
    Type: Number
    Default: 2
  NodeGroupMinSize:
    Type: Number
    Default: 1
  NodeGroupMaxSize:
    Type: Number
    Default: 3

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24

Conditions:
  HasKubernetesVersion: !Not [!Equals [!Ref KubernetesVersion, ""]]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-public-1"
        # Required for EKS to discover subnets for this cluster, and for the
        # AWS cloud controller manager to place internet-facing
        # LoadBalancer Services (lambda-egress-proxy, data-ingestion) here.
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-public-2"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !If [HasKubernetesVersion, !Ref KubernetesVersion, !Ref "AWS::NoValue"]
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        EndpointPublicAccess: true
        EndpointPrivateAccess: false
      AccessConfig:
        # Keeps the aws-auth ConfigMap usable alongside the newer access-entry
        # API - simplest default for a test cluster.
        AuthenticationMode: API_AND_CONFIG_MAP

  NodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        # Lets you shell into nodes via SSM instead of managing SSH key pairs.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    # Nodes must have a route to the Internet Gateway before they boot, or they
    # cannot reach ECR/the EKS endpoint and fail to join the cluster.
    DependsOn:
      - PublicRoute
      - PublicSubnet1RouteTableAssociation
      - PublicSubnet2RouteTableAssociation
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub "${ClusterName}-ng"
      NodeRole: !GetAtt NodeInstanceRole.Arn
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      InstanceTypes:
        - !Ref NodeInstanceType
      AmiType: AL2023_x86_64_STANDARD
      DiskSize: 40
      # Matches the akto-regional-setup chart's default nodeSelector
      # ({workload: cpu}), so the chart installs without overriding it.
      Labels:
        workload: cpu
      ScalingConfig:
        MinSize: !Ref NodeGroupMinSize
        MaxSize: !Ref NodeGroupMaxSize
        DesiredSize: !Ref NodeGroupDesiredSize

Outputs:
  ClusterName:
    Value: !Ref EKSCluster
  ConfigureKubectl:
    Description: Run this to point kubectl/helm at the new cluster.
    Value: !Sub "aws eks update-kubeconfig --region ${AWS::Region} --name ${ClusterName}"
  VpcId:
    Value: !Ref VPC
  PublicSubnetIds:
    Value: !Sub "${PublicSubnet1},${PublicSubnet2}"
  NextStep:
    Description: >
      Infrastructure only - deploy akto-regional-setup with helm next (see
      chat history / charts/akto-regional-setup/README.md for the install
      command enabling lambdaEgressProxy, dataIngestion, guardrailsService.http
      and miniRuntime). Nodes are labelled workload=cpu, so the chart's
      default nodeSelector needs no override.
    Value: "helm install akto-regional-setup ./charts/akto-regional-setup -n akto-regional ..."
